[project]
name = "nanobot-rebuild"
version = "0.16.0"
description = "Rebuild a lightweight AI agent from scratch"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.8.0",
    "pydantic>=2.12.0,<3.0.0",
    "tiktoken>=0.8.0",
    "pyyaml>=6.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["runtime*", "tests*", "workspace*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires explicitly configured external services",
]
